<!DOCTYPE html>
<html>
<head>
    <title>Register - Campus Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
    </nav>

    <div class="container">
        <h1 id="reg-heading">Student Registration</h1>
        <p>Fill out the form to register for an event.</p>

        <div id="form-container">
            <p id="error-message" class="error-msg"></p>
            
            <form id="registrationForm" onsubmit="handleRegistration(event)">
                <label>Student Name:</label>
                <input type="text" id="studentName">

                <label>Student Roll Number:</label>
                <input type="text" id="rollNumber">

                <label>Email Address:</label>
                <input type="email" id="email">

                <label>Event Selection:</label>
                <select id="eventSelect">
                    <option value="">Select Event</option>
                    <option value="Tech Fest 2026">Tech Fest 2026</option>
                    <option value="Coding Workshop">Coding Workshop</option>
                    <option value="Debate Competition">Debate Competition</option>
                </select>

                <button type="submit">Register</button>
            </form>
        </div>

        <p id="confirmationMessage" class="success-msg"></p>

        <br>
        <button onclick="changeHeadingFontSize()">Change Heading Size</button>
        <button onclick="toggleRegistrationForm()">Show/Hide Form</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
